[tool.poetry]
name = "openbb-sharkquant"
version = "0.1.0"
description = "SharkQuant provider — serves OpenBB standard models from the SharkQuant Postgres archive (fmp_bulk + fmp_feeds)."
authors = ["SharkQuant <david@sharkquant.ai>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_sharkquant" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.3"
psycopg2-binary = "^2.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
sharkquant = "openbb_sharkquant:sharkquant_provider"
