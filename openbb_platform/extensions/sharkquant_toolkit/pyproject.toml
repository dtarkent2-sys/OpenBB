[tool.poetry]
name = "openbb-sharkquant-toolkit"
version = "0.1.0"
description = "SharkQuant FinanceToolkit extension — exposes JerBouma/FinanceToolkit's ratios, models, performance, risk, and technicals as OpenBB API endpoints. Requires FMP_API_KEY in env."
authors = ["SharkQuant <david@sharkquant.ai>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_sharkquant_toolkit" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.3"
financetoolkit = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_core_extension"]
finance_toolkit = "openbb_sharkquant_toolkit.finance_toolkit_router:router"
